split_strategy: grouped_kfold
fold_count: 5
folds:
  - 1
  - 2
  - 3
  - 4
  - 5
validation_offset: 1
model_seed_base: 42

experiments:
  ablation_config: config/ablation.yaml
  model_comparison_config: config/model_comparison.yaml
  open_set_config: config/open_set.yaml

output:
  root_directory: results/repeated
  aggregate_confusion_matrix_outputs:
    - results/ablation/figures/all_views_confusion_matrix.png
    - dissertation/images/all_views_confusion_matrix.png
