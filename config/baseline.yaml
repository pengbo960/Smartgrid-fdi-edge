dataset:
  path: data/processed/multiview_v2_dataset.csv

labels:
  target_column: is_attack

  known_attack_types:
    - none
    - constant
    - random
    - replay
    - topic_spoof

  excluded_attack_types:
    - gradual

features:
  include_groups:
    - value
    - temporal
    - protocol

split:
  group_column: source_file
  random_seed: 42

preprocessing:
  drop_warmup_rows: false
  maximum_missing_fraction: 0.0

model:
  class_weight: balanced
  max_iter: 1000
  random_seed: 42
  default_threshold: 0.5
  threshold_metric: macro_f1

output:
  model_path: models/logistic_multiview_v2.joblib
  scaler_path: models/logistic_multiview_v2_scaler.joblib
  feature_names_path: models/logistic_multiview_v2_features.json
  metrics_path: results/v2/metrics/logistic_multiview_metrics.json
  predictions_path: results/v2/predictions/logistic_multiview_predictions.csv

  confusion_matrix_path: results/v2/figures/logistic_multiview_confusion_matrix.png
  roc_curve_path: results/v2/figures/logistic_multiview_roc_curve.png
  pr_curve_path: results/v2/figures/logistic_multiview_pr_curve.png
  threshold_curve_path: results/v2/figures/logistic_multiview_threshold_curve.png
